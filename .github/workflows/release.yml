name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.2.0 or latest)'
        required: false
        default: 'latest'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build & Package (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --no-default-features --bin server-rs

      - name: Package Windows Release
        shell: pwsh
        run: |
          $distDir = "staging/MyTranslation-rs"
          New-Item -ItemType Directory -Force -Path "$distDir/fonts" | Out-Null
          New-Item -ItemType Directory -Force -Path "$distDir/models" | Out-Null

          Copy-Item "target/release/server-rs.exe" "$distDir/"
          Copy-Item "target/release/DirectML.dll" "$distDir/"
          Copy-Item "fonts/*" "$distDir/fonts/" -Recurse
          Copy-Item "config.example.json" "$distDir/"
          Copy-Item "README.md" "$distDir/"

          $models = @(
            @{
              url = "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.0/onnx/PP-OCRv4/det/en_PP-OCRv3_det_mobile.onnx"
              name = "en_PP-OCRv3_det_mobile.onnx"
            },
            @{
              url = "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.0/onnx/PP-OCRv4/rec/en_PP-OCRv4_rec_mobile.onnx"
              name = "en_PP-OCRv4_rec_mobile.onnx"
            },
            @{
              url = "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.0/onnx/PP-OCRv4/cls/ch_ppocr_mobile_v2.0_cls_mobile.onnx"
              name = "ch_ppocr_mobile_v2.0_cls_mobile.onnx"
            },
            @{
              url = "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/master/paddle/PP-OCRv4/rec/en_PP-OCRv4_rec_mobile/en_dict.txt"
              name = "en_dict.txt"
            }
          )

          foreach ($m in $models) {
            $dest = "$distDir/models/$($m.name)"
            Write-Host "Downloading $($m.name)..."
            Invoke-WebRequest -Uri $m.url -OutFile $dest -UseBasicParsing
          }

          Compress-Archive -Path "$distDir" -DestinationPath "MyTranslation-rs-windows-x64.zip" -CompressionLevel Optimal
          Write-Host "Successfully packaged MyTranslation-rs-windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: MyTranslation-rs-windows-x64.zip

  build-ubuntu:
    name: Build & Package (Ubuntu x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --no-default-features --bin server-rs

      - name: Package Ubuntu Release
        run: |
          DIST_DIR="staging/MyTranslation-rs"
          mkdir -p "$DIST_DIR/fonts" "$DIST_DIR/models"

          cp target/release/server-rs "$DIST_DIR/server-rs"
          chmod +x "$DIST_DIR/server-rs"
          cp -r fonts/* "$DIST_DIR/fonts/"
          cp config.example.json "$DIST_DIR/"
          cp README.md "$DIST_DIR/"
          cp run.sh "$DIST_DIR/"
          chmod +x "$DIST_DIR/run.sh"

          curl -sSL -o "$DIST_DIR/models/en_PP-OCRv3_det_mobile.onnx" "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.0/onnx/PP-OCRv4/det/en_PP-OCRv3_det_mobile.onnx"
          curl -sSL -o "$DIST_DIR/models/en_PP-OCRv4_rec_mobile.onnx" "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.0/onnx/PP-OCRv4/rec/en_PP-OCRv4_rec_mobile.onnx"
          curl -sSL -o "$DIST_DIR/models/ch_ppocr_mobile_v2.0_cls_mobile.onnx" "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.0/onnx/PP-OCRv4/cls/ch_ppocr_mobile_v2.0_cls_mobile.onnx"
          curl -sSL -o "$DIST_DIR/models/en_dict.txt" "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/master/paddle/PP-OCRv4/rec/en_PP-OCRv4_rec_mobile/en_dict.txt"

          tar -czf MyTranslation-rs-ubuntu-x64.tar.gz -C staging MyTranslation-rs
          ls -lh MyTranslation-rs-ubuntu-x64.tar.gz

      - name: Upload Ubuntu Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-artifact
          path: MyTranslation-rs-ubuntu-x64.tar.gz

  package-extensions:
    name: Package Browser Extensions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip Chrome & Firefox Extensions Separately
        run: |
          sudo apt-get update -qq && sudo apt-get install -y zip
          (cd extension/chrome && zip -r ../../chrome-extension.zip .)
          (cd extension/firefox && zip -r ../../firefox-extension.zip .)
          ls -lh chrome-extension.zip firefox-extension.zip

      - name: Upload Chrome Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-artifact
          path: chrome-extension.zip

      - name: Upload Firefox Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension-artifact
          path: firefox-extension.zip

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-ubuntu, package-extensions]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Resolve Release Tag & Mode
        id: resolve_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] && [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="latest"
          fi

          if [ "$TAG" = "latest" ]; then
            RELEASE_NAME="MyTranslation-rs Latest Build"
            IS_PRERELEASE="true"
            MAKE_LATEST="false"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f latest
            git push -f origin latest
          else
            RELEASE_NAME="MyTranslation-rs $TAG"
            IS_PRERELEASE="false"
            MAKE_LATEST="true"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "make_latest=$MAKE_LATEST" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: ${{ steps.resolve_tag.outputs.name }}
          draft: false
          prerelease: ${{ steps.resolve_tag.outputs.prerelease }}
          make_latest: ${{ steps.resolve_tag.outputs.make_latest }}
          files: |
            MyTranslation-rs-windows-x64.zip
            MyTranslation-rs-ubuntu-x64.tar.gz
            chrome-extension.zip
            firefox-extension.zip
          generate_release_notes: true

  build-docker:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker metadata
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.ref_type }}" = "tag" ] && [ -n "${{ github.ref_name }}" ]; then
            TAGS="${IMAGE_NAME}:${{ github.ref_name }},${IMAGE_NAME}:latest"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ] && [ "${{ inputs.version }}" != "latest" ]; then
            TAGS="${IMAGE_NAME}:${{ inputs.version }},${IMAGE_NAME}:latest"
          else
            TAGS="${IMAGE_NAME}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
