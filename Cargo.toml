[package]
name = "server-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
reqwest = { version = "0.12", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = "0.25"
ab_glyph = "0.2"
base64 = "0.22"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.10"
regex = "1.11"

[target.'cfg(windows)'.dependencies]
rapidocr-core = { version = "0.2.2", default-features = false, features = ["model-download", "directml"] }
ort = { version = "=2.0.0-rc.12", features = ["directml"] }

[target.'cfg(not(windows))'.dependencies]
rapidocr-core = { version = "0.2.2", default-features = false, features = ["model-download"] }
ort = { version = "=2.0.0-rc.12" }
